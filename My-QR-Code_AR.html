.btn:disabled{background:#9CA3AF}
#qrBox{margin:16px 0;display:flex;justify-content:center}
.name{font-size:20px;font-weight:800;margin-top:8px}
.meta{font-size:13px;color:#6B7280;margin-top:2px}
.id{font-size:11px;color:#9CA3AF;margin-top:6px;font-family:monospace;direction:ltr}
.note{font-size:11px;color:#9CA3AF;text-align:center;margin-top:10px;line-height:1.7}
.error{background:#FEE2E2;color:#B91C1C;padding:12px;border-radius:8px;font-size:13px;text-align:center;font-weight:700}
.change{font-size:12px;color:#1B2A63;text-align:center;margin-top:10px;cursor:pointer;text-decoration:underline}

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAf/Z" alt="شركة العرب">
    <h1>كودي الشخصي — شركة العرب للتنظيفات</h1>
  </div>

  <div class="card" id="setupCard" style="display:none">
    <label>اختر اسمك من القائمة (أول مرة بس)</label>
    <select id="empSelect"><option value="">جاري التحميل...</option></select>
    <button class="btn" onclick="confirmSelection()">تأكيد — هذا أنا</button>
  </div>

  <div class="card" id="qrCard" style="display:none">
    <div id="qrBox"></div>
    <div class="name" id="empName"></div>
    <div class="meta" id="empMeta"></div>
    <div class="id" id="empId"></div>
  </div>

  <div class="card error" id="errorCard" style="display:none"></div>

  <div class="change" id="changeLink" style="display:none" onclick="resetSelection()">لست أنا؟ / تغيير الاسم</div>

  <div class="note">يُرجى حفظ هذه الصورة في معرض الصور (اضغط مطولًا ← حفظ الصورة) لفتحها بسرعة حتى بدون اتصال بالإنترنت. هذا الكود مرتبط بملفك في النظام — وفي حال تغيّر أي من بياناتك، سيتحدّث تلقائيًا.</div>
</div>

<script>
const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbz7AFQob-JQdsMFzcYQDgXUT5BBsqhNPh9AexB9ZMhCm_ZT5ZEWJfF2Z1rulx-aOgYL2g/exec';
let employees = [];

fetch(WEBHOOK_URL + '?action=employees')
  .then(r => r.json())
  .then(data => {
    employees = data.employees || [];
    const savedId = localStorage.getItem('myEmployeeId');
    if (savedId) {
      showQR(savedId);
    } else {
      showSetup();
    }
  })
  .catch(() => {
    document.getElementById('errorCard').style.display = 'block';
    document.getElementById('errorCard').textContent = 'لا يوجد اتصال بالإنترنت حاليًا. يُرجى فتح هذه الصفحة أول مرة أثناء الاتصال بالإنترنت.';
  });

function showSetup() {
  const sel = document.getElementById('empSelect');
  sel.innerHTML = '<option value="">-- اختر اسمك --</option>' +
    employees.filter(e => e.status !== 'Inactive').map(e => `<option value="${e.id}">${e.name} (${e.role})</option>`).join('');
  document.getElementById('setupCard').style.display = 'block';
}

function confirmSelection() {
  const id = document.getElementById('empSelect').value;
  if (!id) { alert('اختر اسمك الأول'); return; }
  localStorage.setItem('myEmployeeId', id);
  showQR(id);
}

function resetSelection() {
  localStorage.removeItem('myEmployeeId');
  document.getElementById('qrCard').style.display = 'none';
  document.getElementById('changeLink').style.display = 'none';
  document.getElementById('errorCard').style.display = 'none';
  showSetup();
}

function showQR(id) {
  const emp = employees.find(e => e.id === id);
  document.getElementById('setupCard').style.display = 'none';

  if (!emp || emp.status === 'Inactive') {
    document.getElementById('errorCard').style.display = 'block';
    document.getElementById('errorCard').textContent = 'هذا الكود غير مُفعّل حاليًا. يُرجى التواصل مع المشرف أو الإدارة.';
    return;
  }

  document.getElementById('qrCard').style.display = 'block';
  document.getElementById('changeLink').style.display = 'block';
  document.getElementById('empName').textContent = emp.name;
  document.getElementById('empMeta').textContent = `${emp.role} — ${emp.nationality}`;
  document.getElementById('empId').textContent = emp.id;

  document.getElementById('qrBox').innerHTML = '';
  new QRCode(document.getElementById('qrBox'), {
    text: `AAOS|${emp.id}|${emp.name}`,
    width: 220,
    height: 220,
    correctLevel: QRCode.CorrectLevel.M
  });
}
</script>
