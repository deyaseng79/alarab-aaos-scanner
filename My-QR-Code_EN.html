<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My QR Code — AAOS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;direction:ltr;background:#F1F5F9;color:#111827;font-size:14px;padding:14px;min-height:100vh}
.wrap{max-width:420px;margin:0 auto}
.header{background:linear-gradient(135deg,#7C2D12,#9A3412);color:white;padding:14px 16px;border-radius:10px;margin-bottom:12px;text-align:center}
.header h1{font-size:16px}
.card{background:white;border-radius:12px;padding:18px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.07);text-align:center}
label{display:block;font-size:11px;font-weight:700;color:#6B7280;margin-bottom:6px;text-align:left}
select{width:100%;padding:10px;border-radius:6px;border:1px solid #D1D5DB;font-size:15px;margin-bottom:10px;font-family:inherit}
.btn{width:100%;padding:12px;background:#065F46;color:white;border:none;border-radius:8px;font-size:15px;font-weight:800;cursor:pointer}
.btn:disabled{background:#9CA3AF}
#qrBox{margin:16px 0;display:flex;justify-content:center}
.name{font-size:20px;font-weight:800;margin-top:8px}
.meta{font-size:13px;color:#6B7280;margin-top:2px}
.id{font-size:11px;color:#9CA3AF;margin-top:6px;font-family:monospace}
.note{font-size:11px;color:#9CA3AF;text-align:center;margin-top:10px;line-height:1.7}
.error{background:#FEE2E2;color:#B91C1C;padding:12px;border-radius:8px;font-size:13px;text-align:center;font-weight:700}
.change{font-size:12px;color:#1D4ED8;text-align:center;margin-top:10px;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>My Personal Code — AAOS System</h1>
  </div>

  <div class="card" id="setupCard" style="display:none">
    <label>Select your name from the list (first time only)</label>
    <select id="empSelect"><option value="">Loading...</option></select>
    <button class="btn" onclick="confirmSelection()">Confirm — This is Me</button>
  </div>

  <div class="card" id="qrCard" style="display:none">
    <div id="qrBox"></div>
    <div class="name" id="empName"></div>
    <div class="meta" id="empMeta"></div>
    <div class="id" id="empId"></div>
  </div>

  <div class="card error" id="errorCard" style="display:none"></div>

  <div class="change" id="changeLink" style="display:none" onclick="resetSelection()">Not me? / Change name</div>

  <div class="note">Save this image to your photo gallery (press and hold ← Save Image) so you can open it quickly even without internet. This code is linked to your file in the system — if anything about your data changes, it will update automatically.</div>
</div>

<script>
const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbz7AFQob-JQdsMFzcYQDgXUT5BBsqhNPh9AexB9ZMhCm_ZT5ZEWJfF2Z1rulx-aOgYL2g/exec';
let employees = [];

fetch(WEBHOOK_URL + '?action=employees')
  .then(r => r.json())
  .then(data => {
    employees = data.employees || [];
    const savedId = localStorage.getItem('myEmployeeId');
    if (savedId) {
      showQR(savedId);
    } else {
      showSetup();
    }
  })
  .catch(() => {
    document.getElementById('errorCard').style.display = 'block';
    document.getElementById('errorCard').textContent = 'No internet connection right now. You need to open this page once while connected.';
  });

function showSetup() {
  const sel = document.getElementById('empSelect');
  sel.innerHTML = '<option value="">-- Select your name --</option>' +
    employees.filter(e => e.status !== 'Inactive').map(e => `<option value="${e.id}">${e.name} (${e.role})</option>`).join('');
  document.getElementById('setupCard').style.display = 'block';
}

function confirmSelection() {
  const id = document.getElementById('empSelect').value;
  if (!id) { alert('Select your name first'); return; }
  localStorage.setItem('myEmployeeId', id);
  showQR(id);
}

function resetSelection() {
  localStorage.removeItem('myEmployeeId');
  document.getElementById('qrCard').style.display = 'none';
  document.getElementById('changeLink').style.display = 'none';
  document.getElementById('errorCard').style.display = 'none';
  showSetup();
}

function showQR(id) {
  const emp = employees.find(e => e.id === id);
  document.getElementById('setupCard').style.display = 'none';

  if (!emp || emp.status === 'Inactive') {
    document.getElementById('errorCard').style.display = 'block';
    document.getElementById('errorCard').textContent = 'This code is not active right now. Contact your supervisor or management.';
    return;
  }

  document.getElementById('qrCard').style.display = 'block';
  document.getElementById('changeLink').style.display = 'block';
  document.getElementById('empName').textContent = emp.name;
  document.getElementById('empMeta').textContent = `${emp.role} — ${emp.nationality}`;
  document.getElementById('empId').textContent = emp.id;

  document.getElementById('qrBox').innerHTML = '';
  new QRCode(document.getElementById('qrBox'), {
    text: `AAOS|${emp.id}|${emp.name}`,
    width: 220,
    height: 220,
    correctLevel: QRCode.CorrectLevel.M
  });
}
</script>
</body>
</html>
